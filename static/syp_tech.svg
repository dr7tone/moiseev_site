<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#ffe9cc"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>
  <!-- Python -->
  <rect x="30" y="40" width="100" height="100" rx="16" fill="#fff" stroke="#e8d5b8" stroke-width="2"/>
  <text x="80" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ff8c00">Py</text>
  <text x="80" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#555">Python</text>
  <!-- FastAPI -->
  <rect x="150" y="40" width="100" height="100" rx="16" fill="#fff" stroke="#e8d5b8" stroke-width="2"/>
  <text x="200" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ff8c00">⚡</text>
  <text x="200" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#555">FastAPI</text>
  <!-- PostgreSQL -->
  <rect x="270" y="40" width="100" height="100" rx="16" fill="#fff" stroke="#e8d5b8" stroke-width="2"/>
  <text x="320" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ff8c00">DB</text>
  <text x="320" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#555">PostgreSQL</text>
  <!-- Docker -->
  <rect x="30" y="160" width="100" height="100" rx="16" fill="#fff" stroke="#e8d5b8" stroke-width="2"/>
  <text x="80" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ff8c00">🐳</text>
  <text x="80" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#555">Docker</text>
  <!-- JWT -->
  <rect x="150" y="160" width="100" height="100" rx="16" fill="#fff" stroke="#e8d5b8" stroke-width="2"/>
  <text x="200" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ff8c00">🔐</text>
  <text x="200" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#555">JWT Auth</text>
  <!-- NFC -->
  <rect x="270" y="160" width="100" height="100" rx="16" fill="#fff" stroke="#e8d5b8" stroke-width="2"/>
  <text x="320" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ff8c00">📡</text>
  <text x="320" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#555">NFC</text>
</svg>